<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Partner Registration</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Favicon and web app icons -->
  <link rel="icon" href="partner-logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="partner-logo.png" />
  <link rel="manifest" href="partner-manifest.json" />

  <!-- iOS meta tags for standalone mode and status bar -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Driver Partner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <header>
    <h1>Driver Partner Registration</h1>
  </header>

  <main>
    <form id="partnerForm" enctype="multipart/form-data">
      <input type="text" name="companyName" placeholder="Company Name" required />
      <input type="text" name="fullName" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="tel" name="phone" placeholder="Phone Number" required />

      <input type="text" name="carMake" placeholder="Car Make" required />
      <input type="text" name="carModel" placeholder="Car Model" required />
      <input type="number" name="carYear" placeholder="Car Year" required />

      <label>Registration Expiry</label>
      <input type="date" name="regoExpiry" required />

      <label>Insurance Expiry</label>
      <input type="date" name="insuranceExpiry" required />

      <label>Upload Insurance Papers</label>
      <input type="file" name="insuranceFile" accept=".pdf,.jpg,.jpeg,.png" required />

      <label>Upload Registration (Pink Slip)</label>
      <input type="file" name="regoFile" accept=".pdf,.jpg,.jpeg,.png" required />

      <label>Upload ABN Certificate</label>
      <input type="file" name="abnFile" accept=".pdf,.jpg,.jpeg,.png" required />

      <button type="submit">Submit</button>
    </form>
  </main>

  <!-- Loading spinner overlay -->
  <div id="loadingSpinner" style="display:none;">
    <div class="spinner"></div>
  </div>

  <script>
    document.getElementById('partnerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      // Collect FormData before disabling inputs
      const formData = new FormData(this);

      const spinner = document.getElementById('loadingSpinner');
      spinner.style.display = 'flex'; // show spinner as flex to center

      // Disable form inputs while loading
      const formElements = this.elements;
      for(let i = 0; i < formElements.length; i++) {
        formElements[i].disabled = true;
      }

      try {
        const res = await fetch('https://server-qdh1.onrender.com/partner-form', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          alert('Form submitted successfully!');
          this.reset();
        } else {
          alert('Something went wrong.');
        }
      } catch (error) {
        alert('Network error. Please try again.');
      } finally {
        spinner.style.display = 'none'; // hide spinner
        // Re-enable form inputs
        for(let i = 0; i < formElements.length; i++) {
          formElements[i].disabled = false;
        }
      }
    });
  </script>
</body>
</html>

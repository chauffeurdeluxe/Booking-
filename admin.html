<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Assignment Admin - Chauffeur de Luxe</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Admin Assignment" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />
</head>
<body>
  <header class="admin-header">
    <div class="header-top">
      <img src="icon.png" alt="Chauffeur de Luxe Logo" class="logo" />
      <h1 class="site-title">Chauffeur De Luxe</h1>
    </div>
    <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
  </header>

  <main class="container">
    <h1 class="section-title">Pending Bookings</h1>
    <div id="pendingBookings" class="booking-list">Loading bookings...</div>

    <h1 class="section-title">Assign Job</h1>

    <!-- Hidden customer info aligned with server -->
    <input type="hidden" id="id" />

    <label class="form-label" for="name">Customer Name:</label>
    <input type="text" id="name" placeholder="Customer name" class="form-field" />

    <label class="form-label" for="email">Customer Email:</label>
    <input type="email" id="email" placeholder="Customer email" class="form-field" />

    <label class="form-label" for="phone">Customer Phone:</label>
    <input type="tel" id="phone" placeholder="Customer phone" class="form-field" />
    
    <label class="form-label">Pickup Location:</label>
    <input type="text" id="pickup" placeholder="Pickup address" class="form-field" />

    <label class="form-label">Dropoff Location:</label>
    <input type="text" id="dropoff" placeholder="Dropoff address" class="form-field" />

    <label class="form-label">Date & Time:</label>
    <input type="datetime-local" id="datetime" class="form-field" />

    <label class="form-label">Vehicle Type:</label>
    <input type="text" id="vehicleType" placeholder="Vehicle type" class="form-field" />

    <label class="form-label">Total Fare:</label>
    <input type="number" id="totalFare" placeholder="Total fare" step="0.01" class="form-field" />

    <label class="form-label">Distance (km):</label>
    <input type="number" id="distanceKm" placeholder="Distance in km" step="0.1" class="form-field" />

    <label class="form-label">Duration (min):</label>
    <input type="number" id="durationMin" placeholder="Duration in minutes" class="form-field" />

    <label class="form-label">Notes:</label>
    <textarea id="notes" placeholder="Optional notes" rows="3" class="form-field"></textarea>

    <label class="form-label">Assign to Driver Email:</label>
    <input list="drivers" id="driverEmail" placeholder="Type or select driver email" class="form-field" />
    <datalist id="drivers"></datalist>

    <button id="assignBtn" class="btn">Assign Job</button>
    <div id="status" class="status"></div>
  </main>

  <script>
    const API_BASE = 'https://server-qdh1.onrender.com';
    const pendingBookingsDiv = document.getElementById('pendingBookings');
    const assignBtn = document.getElementById('assignBtn');
    const statusDiv = document.getElementById('status');
    const driversDatalist = document.getElementById('drivers');

    let pendingBookings = [];

    async function loadPendingBookings() {
      try {
        const res = await fetch(`${API_BASE}/pending-bookings`);
        pendingBookings = await res.json();
        if (!pendingBookings || pendingBookings.length === 0) {
          pendingBookingsDiv.textContent = 'No pending bookings.';
        } else {
          renderPendingBookings();
        }
      } catch (err) {
        console.error(err);
        pendingBookingsDiv.textContent = 'No pending bookings.';
      }
    }

    function renderPendingBookings() {
      pendingBookingsDiv.innerHTML = '';
      pendingBookings.forEach((booking) => {
        const div = document.createElement('div');
        div.className = 'booking-item';
        div.innerHTML = `<strong>${booking.name}</strong> - ${booking.pickup} → ${booking.dropoff} (${booking.datetime})`;
        div.addEventListener('click', () => populateForm(booking));
        pendingBookingsDiv.appendChild(div);
      });
    }

    function populateForm(booking) {
      document.getElementById('id').value = booking.id || '';
      document.getElementById('name').value = booking.name;
      document.getElementById('email').value = booking.email;
      document.getElementById('phone').value = booking.phone;
      document.getElementById('pickup').value = booking.pickup;
      document.getElementById('dropoff').value = booking.dropoff;
      document.getElementById('datetime').value = booking.datetime;
      document.getElementById('vehicleType').value = booking.vehicleType;
      document.getElementById('totalFare').value = booking.totalFare || '';
      document.getElementById('distanceKm').value = booking.distanceKm || '';
      document.getElementById('durationMin').value = booking.durationMin || '';
      document.getElementById('notes').value = booking.notes || '';
    }

    async function loadDrivers() {
      try {
        const res = await fetch(`${API_BASE}/drivers`);
        const drivers = await res.json();
        driversDatalist.innerHTML = '';
        drivers.forEach(driver => {
          const option = document.createElement('option');
          option.value = driver.email;
          driversDatalist.appendChild(option);
        });
      } catch (err) {
        console.error('Failed to load drivers:', err);
      }
    }

    assignBtn.addEventListener('click', async () => {
      statusDiv.textContent = '';

      const bookingData = {
        id: document.getElementById('id').value,
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        pickup: document.getElementById('pickup').value.trim(),
        dropoff: document.getElementById('dropoff').value.trim(),
        datetime: document.getElementById('datetime').value,
        vehicleType: document.getElementById('vehicleType').value.trim(),
        totalFare: parseFloat(document.getElementById('totalFare').value) || 0,
        distanceKm: parseFloat(document.getElementById('distanceKm').value) || 0,
        durationMin: parseFloat(document.getElementById('durationMin').value) || 0,
        notes: document.getElementById('notes').value.trim()
      };

      const driverEmail = document.getElementById('driverEmail').value.trim();

      if (!bookingData.pickup || !bookingData.dropoff || !bookingData.datetime || !bookingData.vehicleType || !bookingData.totalFare) {
        statusDiv.textContent = 'Please fill in all required booking details.';
        statusDiv.classList.add('error');
        return;
      }
      if (!driverEmail) {
        statusDiv.textContent = 'Please enter or select a driver email.';
        statusDiv.classList.add('error');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/assign-job`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, bookingData })
        });
        const result = await response.json();

        if (response.ok) {
          statusDiv.textContent = `✅ Job assigned successfully! Job ID: ${result.jobId}`;
          statusDiv.classList.remove('error');
        } else {
          statusDiv.textContent = `❌ Error: ${result.error || 'Failed to assign job.'}`;
          statusDiv.classList.add('error');
        }
      } catch (error) {
        statusDiv.textContent = '🚫 Network or server error.';
        statusDiv.classList.add('error');
      }
    });

    loadPendingBookings();
    loadDrivers();

    // Auto-refresh pending bookings every 30 seconds
    setInterval(loadPendingBookings, 30000);
    </script>
    </body>
    </html>

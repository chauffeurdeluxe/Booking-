<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Assignment Admin - Chauffeur de Luxe</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Admin Assignment" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    body { background-color: #000; color: #d4af37; font-family: 'Georgia', serif; padding: 20px; max-width: 700px; margin: auto; }
    h1 { text-align: center; margin-bottom: 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #111; border: 1px solid #d4af37; color: #d4af37; font-size: 1em; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 20px; background-color: #d4af37; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; border-radius: 4px; }
    #status { margin-top: 15px; font-weight: bold; }
    .booking-item { padding: 10px; border: 1px solid #d4af37; margin-bottom: 10px; cursor: pointer; border-radius: 4px; }
    .booking-item:hover { background: #111; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <img src="icon.png" alt="Chauffeur de Luxe Logo" />
      <h1>Chauffeur De Luxe</h1>
    </div>
    <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
  </header>

  <h1>Pending Bookings</h1>
  <div id="pendingBookings">Loading bookings...</div>

  <h1>Assign Job</h1>

  <label>Customer Name:</label>
  <input type="text" id="customerName" placeholder="Customer name" />

  <label>Pickup Location:</label>
  <input type="text" id="pickupLocation" placeholder="Pickup address" />

  <label>Dropoff Location:</label>
  <input type="text" id="dropoffLocation" placeholder="Dropoff address" />

  <label>Date:</label>
  <input type="date" id="date" />

  <label>Time:</label>
  <input type="time" id="time" />

  <label>Vehicle Type:</label>
  <input type="text" id="vehicleType" placeholder="Vehicle type" />

  <label>Total Fare:</label>
  <input type="number" id="totalFare" placeholder="Total fare" step="0.01" />

  <label>Distance (km):</label>
  <input type="number" id="distanceKm" placeholder="Distance in km" step="0.1" />

  <label>Duration (min):</label>
  <input type="number" id="durationMin" placeholder="Duration in minutes" />

  <label>Notes:</label>
  <textarea id="notes" placeholder="Optional notes"></textarea>

  <label>Assign to Driver Email:</label>
  <input list="drivers" id="driverEmail" placeholder="Type or select driver email" />
  <datalist id="drivers">
    <option value="farahjnr@gmail.com"></option>
    <option value="driver2@example.com"></option>
    <option value="driver3@example.com"></option>
    <option value="driver4@example.com"></option>
    <option value="driver5@example.com"></option>
  </datalist>

  <button id="assignBtn">Assign Job</button>
  <div id="status"></div>

  <script>
    const pendingBookingsDiv = document.getElementById('pendingBookings');
    const assignBtn = document.getElementById('assignBtn');
    const statusDiv = document.getElementById('status');

    let pendingBookings = [];

    // Load pending bookings from server
    async function loadPendingBookings() {
      try {
        const res = await fetch('/pending-bookings'); // You need to create this route in server.js
        pendingBookings = await res.json();
        renderPendingBookings();
      } catch (err) {
        pendingBookingsDiv.textContent = 'Error loading bookings.';
      }
    }

    function renderPendingBookings() {
      if (!pendingBookings.length) {
        pendingBookingsDiv.textContent = 'No pending bookings.';
        return;
      }
      pendingBookingsDiv.innerHTML = '';
      pendingBookings.forEach((booking, idx) => {
        const div = document.createElement('div');
        div.className = 'booking-item';
        div.innerHTML = `<strong>${booking.customerName}</strong> - ${booking.pickup} → ${booking.dropoff} (${booking.date} ${booking.time})`;
        div.addEventListener('click', () => populateForm(booking));
        pendingBookingsDiv.appendChild(div);
      });
    }

    function populateForm(booking) {
      document.getElementById('customerName').value = booking.customerName;
      document.getElementById('pickupLocation').value = booking.pickup;
      document.getElementById('dropoffLocation').value = booking.dropoff;
      document.getElementById('date').value = booking.date;
      document.getElementById('time').value = booking.time;
      document.getElementById('vehicleType').value = booking.vehicleType;
      document.getElementById('totalFare').value = booking.totalFare || '';
      document.getElementById('distanceKm').value = booking.distanceKm || '';
      document.getElementById('durationMin').value = booking.durationMin || '';
      document.getElementById('notes').value = booking.notes || '';
    }

    assignBtn.addEventListener('click', async () => {
      statusDiv.textContent = '';

      const bookingData = {
        customerName: document.getElementById('customerName').value.trim(),
        pickup: document.getElementById('pickupLocation').value.trim(),
        dropoff: document.getElementById('dropoffLocation').value.trim(),
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        vehicleType: document.getElementById('vehicleType').value.trim(),
        totalFare: parseFloat(document.getElementById('totalFare').value),
        distanceKm: parseFloat(document.getElementById('distanceKm').value),
        durationMin: parseFloat(document.getElementById('durationMin').value),
        notes: document.getElementById('notes').value.trim()
      };

      const driverEmail = document.getElementById('driverEmail').value.trim();

      if (!bookingData.customerName || !bookingData.pickup || !bookingData.dropoff ||
          !bookingData.date || !bookingData.time || !bookingData.vehicleType ||
          !bookingData.totalFare || isNaN(bookingData.totalFare)) {
        statusDiv.textContent = 'Please fill in all required booking details.';
        statusDiv.style.color = 'red';
        return;
      }
      if (!driverEmail) {
        statusDiv.textContent = 'Please enter or select a driver email.';
        statusDiv.style.color = 'red';
        return;
      }

      try {
        const response = await fetch('/assign-job', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, bookingData })
        });
        const result = await response.json();

        if (response.ok) {
          statusDiv.textContent = `✅ Job assigned successfully! Job ID: ${result.jobId}`;
          statusDiv.style.color = '#d4af37';
          // Optionally remove the assigned booking from pending list
          pendingBookings = pendingBookings.filter(b => b !== bookingData);
          renderPendingBookings();
        } else {
          statusDiv.textContent = `❌ Error: ${result.error || 'Failed to assign job.'}`;
          statusDiv.style.color = 'red';
        }
      } catch (error) {
        statusDiv.textContent = '🚫 Network or server error.';
        statusDiv.style.color = 'red';
      }
    });

    loadPendingBookings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chauffeur de Luxe - Driver Dashboard</title>
<style>
  body {
    font-family: 'Helvetica', sans-serif;
    background-color: #000;
    color: #B9975B;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
  }
  .login-section, .jobs-section {
    max-width: 1000px;
    margin: 0 auto 30px auto;
    background-color: #111;
    padding: 20px;
    border-radius: 10px;
  }
  input, select, button {
    padding: 10px;
    margin: 5px 5px 15px 0;
    border-radius: 5px;
    border: none;
    font-size: 1em;
  }
  input, select { width: 200px; }
  button {
    background-color: #B9975B;
    color: #000;
    cursor: pointer;
  }
  button:hover { background-color: #FFD700; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #444;
    padding: 10px;
    text-align: left;
  }
  th {
    background-color: #222;
    cursor: pointer;
  }
  tr:nth-child(even) { background-color: #1a1a1a; }
  .badge {
    padding: 5px 10px;
    border-radius: 5px;
    color: #000;
    font-weight: bold;
  }
  .pending { background-color: #FFD700; }
  .confirmed { background-color: #B9975B; }
  .completed { background-color: #00FF00; color: #000; }
  .action-btn { margin-right: 5px; padding: 5px 10px; font-size: 0.9em; }
  .filters { margin-bottom: 10px; }
</style>
</head>
<body>

<h1>Chauffeur de Luxe - Driver Dashboard</h1>

<!-- Login Section -->
<div class="login-section" id="loginDiv">
  <h2>Driver Login</h2>
  <input type="email" id="driverEmail" placeholder="Enter your email">
  <button onclick="driverLogin()">Login</button>
</div>

<!-- Jobs Section -->
<div class="jobs-section" id="jobsDiv" style="display:none;">
  <h2>Jobs</h2>
  
  <!-- Filters -->
  <div class="filters">
    <select id="statusFilter" onchange="applyFilters()">
      <option value="all">All Status</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="completed">Completed</option>
    </select>
    <input type="number" id="minFare" placeholder="Min Fare" oninput="applyFilters()">
    <input type="number" id="maxFare" placeholder="Max Fare" oninput="applyFilters()">
    <input type="text" id="searchPickup" placeholder="Search Pickup" oninput="applyFilters()">
  </div>

  <table id="jobsTable">
    <thead>
      <tr>
        <th onclick="sortTable('pickup')">Pickup → Dropoff</th>
        <th onclick="sortTable('vehicle')">Vehicle</th>
        <th onclick="sortTable('fare')">Fare</th>
        <th onclick="sortTable('distance')">Distance (km)</th>
        <th onclick="sortTable('duration')">Duration (min)</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="jobsTableBody"></tbody>
  </table>
</div>

<script>
let driverEmailGlobal = '';
let allJobs = [];

async function driverLogin() {
  const email = document.getElementById('driverEmail').value.trim();
  if(!email) return alert('Enter your email');
  driverEmailGlobal = email;

  const res = await fetch('/driver-login', {
    method: 'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ email })
  });
  const data = await res.json();
  document.getElementById('loginDiv').style.display='none';
  document.getElementById('jobsDiv').style.display='block';

  allJobs = [...(data.jobs || []).map(j => ({...j, status: j.driverConfirmed ? 'confirmed' : 'pending'})),
             ...(data.completed || []).map(j => ({...j, status: 'completed'}))];

  renderJobs(allJobs);
}

function renderJobs(jobs) {
  const tbody = document.getElementById('jobsTableBody');
  tbody.innerHTML = '';

  if(!jobs.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#FFD700;">No jobs</td></tr>`;
    return;
  }

  jobs.forEach(job => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${job.bookingData?.pickup} → ${job.bookingData?.dropoff}</td>
      <td>${job.bookingData?.vehicleType}</td>
      <td>$${job.bookingData?.totalFare}</td>
      <td>${job.bookingData?.distanceKm || 'N/A'}</td>
      <td>${job.bookingData?.durationMin || 'N/A'}</td>
      <td class="badge ${job.status}">${job.status.charAt(0).toUpperCase() + job.status.slice(1)}</td>
      <td>
        ${job.status === 'pending' ? `
          <button class="action-btn" onclick="respondJob('${job.id}', true)">Confirm</button>
          <button class="action-btn" onclick="respondJob('${job.id}', false)">Decline</button>` :
        (job.status === 'confirmed' ? `<button class="action-btn" onclick="completeJob('${job.id}')">Complete</button>` : '')}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function respondJob(jobId, confirmed) {
  const res = await fetch('/driver-response', {
    method: 'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ driverEmail: driverEmailGlobal, jobId, confirmed })
  });
  const data = await res.json();
  alert(data.message);
  loadJobs();
}

async function completeJob(jobId) {
  const res = await fetch('/driver-complete', {
    method: 'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ driverEmail: driverEmailGlobal, jobId })
  });
  const data = await res.json();
  alert(data.message);
  loadJobs();
}

async function loadJobs() {
  const res = await fetch('/driver-login', {
    method: 'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ email: driverEmailGlobal })
  });
  const data = await res.json();
  allJobs = [...(data.jobs || []).map(j => ({...j, status: j.driverConfirmed ? 'confirmed' : 'pending'})),
             ...(data.completed || []).map(j => ({...j, status: 'completed'}))];
  applyFilters();
}

// Sorting
let sortOrder = {column:'', asc:true};
function sortTable(column) {
  if(sortOrder.column === column) sortOrder.asc = !sortOrder.asc;
  else { sortOrder.column = column; sortOrder.asc = true; }

  allJobs.sort((a,b)=>{
    let valA, valB;
    switch(column){
      case 'pickup': valA=a.bookingData?.pickup; valB=b.bookingData?.pickup; break;
      case 'vehicle': valA=a.bookingData?.vehicleType; valB=b.bookingData?.vehicleType; break;
      case 'fare': valA=parseFloat(a.bookingData?.totalFare); valB=parseFloat(b.bookingData?.totalFare); break;
      case 'distance': valA=parseFloat(a.bookingData?.distanceKm)||0; valB=parseFloat(b.bookingData?.distanceKm)||0; break;
      case 'duration': valA=parseFloat(a.bookingData?.durationMin)||0; valB=parseFloat(b.bookingData?.durationMin)||0; break;
      default: valA=0; valB=0;
    }
    if(valA < valB) return sortOrder.asc ? -1 : 1;
    if(valA > valB) return sortOrder.asc ? 1 : -1;
    return 0;
  });
  applyFilters();
}

// Filtering
function applyFilters() {
  const status = document.getElementById('statusFilter').value;
  const minFare = parseFloat(document.getElementById('minFare').value) || 0;
  const maxFare = parseFloat(document.getElementById('maxFare').value) || Infinity;
  const pickupSearch = document.getElementById('searchPickup').value.toLowerCase();

  const filtered = allJobs.filter(job=>{
    const fare = parseFloat(job.bookingData?.totalFare) || 0;
    const pickup = job.bookingData?.pickup?.toLowerCase() || '';
    return (status==='all' || job.status===status) &&
           fare>=minFare && fare<=maxFare &&
           pickup.includes(pickupSearch);
  });

  renderJobs(filtered);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chauffeur de Luxe - Driver Jobs</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="driver-manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Driver Jobs" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    body { margin:0; background:#000; color:#d4af37; font-family:Arial, sans-serif; text-align:center; }
    header img { width:40px; vertical-align:middle; }
    header h1 { display:inline-block; margin:0; vertical-align:middle; font-size:20px; }
    .tab-bar { 
      position:fixed; bottom:0; left:0; right:0; height:50px; 
      display:flex; background:#111; border-top:2px solid #d4af37;
    }
    .tab-bar button { flex:1; background:none; border:none; color:#d4af37; font-size:16px; cursor:pointer; }
    .tab-bar button.active { background:#d4af37; color:#000; }
    #profileSection img { width:80px; height:80px; border-radius:50%; margin:10px auto; display:block; border:2px solid #d4af37; }
    .profile-box { border:1px solid #d4af37; margin:10px; padding:10px; border-radius:6px; background:#111; text-align:left; }
    .profile-box h3 { margin-top:0; color:#d4af37; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <img src="icon.png" alt="Chauffeur de Luxe Logo" />
      <h1>Chauffeur De Luxe</h1>
    </div>
    <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
  </header>

  <main style="padding-bottom:60px;"> <!-- padding for tab bar -->

    <!-- Login -->
    <section id="loginSection">
      <h2>Driver Login</h2>
      <form id="loginForm">
        <input type="email" id="driverEmail" placeholder="Enter your email" required />
        <button type="submit">Login</button>
      </form>
      <div id="loginError" style="color:#d4af37; margin-top:10px;"></div>
    </section>

    <!-- Jobs -->
    <section id="jobsSection" style="display:none;">
      <h2>Your Assigned Jobs</h2>
      <div id="jobsList" style="text-align:left;"></div>
      <button id="refreshJobs" style="margin-top:20px; background:#d4af37; color:#000; border:2px solid #000; padding:10px; cursor:pointer;">🔄 Refresh Jobs</button>
      <button id="logoutBtn" style="margin-top:20px; background:#000; color:#d4af37; border:2px solid #d4af37; padding:10px; cursor:pointer;">Logout</button>
    </section>

    <!-- Profile -->
    <section id="profileSection" style="display:none;">
      <img src="icon.png" alt="Driver Profile Picture" />
      <h2 id="driverName">Driver Name</h2>
      <p>⭐ 5.0 | 42 ride streak</p>

      <div class="profile-box">
        <h3>Ride History</h3>
        <p>No rides yet.</p>
      </div>

      <div class="profile-box">
        <h3>Profile Details</h3>
        <p>Email: <span id="profileEmail">N/A</span></p>
      </div>

      <div class="profile-box">
        <h3>Support</h3>
        <ul>
          <li>Help Center</li>
          <li>Contact Admin</li>
          <li>App Feedback</li>
        </ul>
      </div>

      <div class="profile-box">
        <h3>Legal</h3>
        <ul>
          <li>Privacy Policy</li>
          <li>Legal Notice</li>
        </ul>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <div class="tab-bar" style="display:none;" id="tabBar">
    <button id="jobsTab" class="active">Jobs</button>
    <button id="profileTab">Profile</button>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginSection = document.getElementById('loginSection');
    const jobsSection = document.getElementById('jobsSection');
    const profileSection = document.getElementById('profileSection');
    const jobsList = document.getElementById('jobsList');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const tabBar = document.getElementById('tabBar');
    const jobsTab = document.getElementById('jobsTab');
    const profileTab = document.getElementById('profileTab');
    const profileEmail = document.getElementById('profileEmail');
    const driverName = document.getElementById('driverName');

    let driverEmail = '';

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      driverEmail = document.getElementById('driverEmail').value.trim();
      if (!driverEmail) {
        loginError.textContent = 'Please enter your email.';
        return;
      }
      await loadJobs();
    });

    logoutBtn.addEventListener('click', () => {
      driverEmail = '';
      jobsList.innerHTML = '';
      loginSection.style.display = 'block';
      jobsSection.style.display = 'none';
      profileSection.style.display = 'none';
      tabBar.style.display = 'none';
      loginForm.reset();
    });

    // Tab switching
    jobsTab.addEventListener('click', () => {
      jobsSection.style.display = 'block';
      profileSection.style.display = 'none';
      jobsTab.classList.add('active');
      profileTab.classList.remove('active');
    });
    profileTab.addEventListener('click', () => {
      jobsSection.style.display = 'none';
      profileSection.style.display = 'block';
      profileTab.classList.add('active');
      jobsTab.classList.remove('active');
    });

    async function loadJobs() {
      try {
        const response = await fetch('https://server-qdh1.onrender.com/driver-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: driverEmail })
        });
        const data = await response.json();
        if (response.ok) {
          showJobs(data.jobs);
          loginSection.style.display = 'none';
          jobsSection.style.display = 'block';
          tabBar.style.display = 'flex';
          profileEmail.textContent = driverEmail;
          driverName.textContent = driverEmail.split('@')[0]; // placeholder name
        } else {
          loginError.textContent = data.error || 'Login failed.';
        }
      } catch (err) {
        loginError.textContent = 'Network error. Please try again.';
      }
    }

    function showJobs(jobs) {
      if (!jobs || jobs.length === 0) {
        jobsList.innerHTML = '<p>No jobs assigned yet.</p>';
        return;
      }
      jobsList.innerHTML = '';
      jobs.forEach(job => {
        const jobDiv = document.createElement('div');
        jobDiv.style.border = '1px solid #d4af37';
        jobDiv.style.padding = '10px';
        jobDiv.style.marginBottom = '10px';
        jobDiv.style.borderRadius = '6px';
        jobDiv.style.backgroundColor = '#111';

        jobDiv.innerHTML = `
          <p><strong>Name:</strong> ${job.bookingData.name || 'N/A'}</p>
          <p><strong>Email:</strong> ${job.bookingData.email || 'N/A'}</p>
          <p><strong>Phone:</strong> ${job.bookingData.phone || 'N/A'}</p>
          <p><strong>Pickup:</strong> ${job.bookingData.pickup}</p>
          <p><strong>Dropoff:</strong> ${job.bookingData.dropoff}</p>
          <p><strong>Pickup Time:</strong> ${new Date(job.bookingData.datetime).toLocaleString()}</p>
          <p><strong>Vehicle Type:</strong> ${job.bookingData.vehicleType}</p>
          <p><strong>Driver Payout:</strong> $${parseFloat(job.driverPay).toFixed(2)}</p>
          <p><strong>Notes:</strong> ${job.bookingData.notes || 'None'}</p>
        `;

        const btnDiv = document.createElement('div');
        btnDiv.style.marginTop = '10px';

        const confirmBtn = document.createElement('button');
        confirmBtn.textContent = '✅ Confirm';
        confirmBtn.style.marginRight = '10px';
        confirmBtn.style.backgroundColor = '#d4af37';
        confirmBtn.style.color = '#000';
        confirmBtn.style.border = 'none';
        confirmBtn.style.padding = '8px';
        confirmBtn.style.cursor = 'pointer';

        confirmBtn.onclick = async () => {
          const success = await respondToJob(job.id, true);
          if (success) {
            confirmBtn.disabled = true;
            confirmBtn.style.opacity = 0.5;

            const completeBtn = document.createElement('button');
            completeBtn.textContent = '🏁 Complete';
            completeBtn.style.backgroundColor = '#000';
            completeBtn.style.color = '#d4af37';
            completeBtn.style.border = '2px solid #d4af37';
            completeBtn.style.padding = '8px';
            completeBtn.style.cursor = 'pointer';
            completeBtn.style.marginLeft = '10px';

            completeBtn.onclick = async () => {
              const completed = await markJobCompleted(job.id);
              if (completed) jobDiv.remove();
            };

            btnDiv.appendChild(completeBtn);
          }
        };

        const refuseBtn = document.createElement('button');
        refuseBtn.textContent = '❌ Refuse';
        refuseBtn.style.backgroundColor = '#000';
        refuseBtn.style.color = '#d4af37';
        refuseBtn.style.border = '2px solid #d4af37';
        refuseBtn.style.padding = '8px';
        refuseBtn.style.cursor = 'pointer';

        refuseBtn.onclick = async () => {
          const success = await respondToJob(job.id, false);
          if (success) jobDiv.remove();
        };

        btnDiv.appendChild(confirmBtn);
        btnDiv.appendChild(refuseBtn);
        jobDiv.appendChild(btnDiv);

        jobsList.appendChild(jobDiv);
      });
    }

    async function respondToJob(jobId, confirmed) {
      if (!driverEmail) return false;
      try {
        const response = await fetch('https://server-qdh1.onrender.com/driver-response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, jobId, confirmed })
        });
        const data = await response.json();
        return response.ok;
      } catch (err) {
        alert('Network error. Please try again.');
        return false;
      }
    }

    async function markJobCompleted(jobId) {
      if (!driverEmail) return false;
      try {
        const response = await fetch('https://server-qdh1.onrender.com/driver-complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, jobId })
        });
        const data = await response.json();
        if (response.ok) {
          alert('Job marked as completed ✅');
          return true;
        } else {
          alert(data.error || 'Failed to mark job as completed.');
          return false;
        }
      } catch (err) {
        alert('Network error. Please try again.');
        return false;
      }
    }

    // Auto-refresh jobs every 30 sec
    setInterval(() => {
      if (driverEmail) loadJobs();
    }, 30000);
  </script>
</body>
</html>

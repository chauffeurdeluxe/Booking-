<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chauffeur de Luxe - Driver Jobs</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chauffeur de Luxe" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />
</head>
<body>
  <header>
    <div class="header-top">
      <img src="icon.png" alt="Chauffeur de Luxe Logo" />
      <h1>Chauffeur De Luxe</h1>
    </div>
    <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
  </header>

  <main>
    <section id="loginSection">
      <h2>Driver Login</h2>
      <form id="loginForm">
        <input type="email" id="driverEmail" placeholder="Enter your email" required />
        <button type="submit">Login</button>
      </form>
      <div id="loginError" style="color: #d4af37; margin-top: 10px;"></div>
    </section>

    <section id="jobsSection" style="display:none;">
      <h2>Your Assigned Jobs</h2>
      <div id="jobsList" style="text-align: left;"></div>

      <h3>Assign New Job</h3>
      <form id="assignJobForm">
        <input type="text" id="pickup" placeholder="Pickup Location" required />
        <input type="text" id="dropoff" placeholder="Dropoff Location" required />
        <input type="datetime-local" id="pickupTime" required />
        <select id="vehicleType" required>
          <option value="">Select Vehicle Class</option>
          <option value="business">Business Class</option>
          <option value="suv">Business Van/SUV</option>
          <option value="first">First Class</option>
        </select>
        <input type="number" id="totalFare" placeholder="Total Fare (AUD)" step="0.01" required />
        <input type="number" id="distanceKm" placeholder="Distance (km)" step="0.01" required />
        <input type="number" id="durationMin" placeholder="Duration (minutes)" step="1" required />
        <textarea id="notes" placeholder="Additional notes (optional)" rows="3"></textarea>
        <button type="submit">Assign Job</button>
      </form>

      <button id="logoutBtn" style="margin-top: 20px; background-color: #000; color: #d4af37; border: 2px solid #d4af37; padding: 10px; cursor: pointer;">Logout</button>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById('loginForm');
    const assignJobForm = document.getElementById('assignJobForm');
    const loginSection = document.getElementById('loginSection');
    const jobsSection = document.getElementById('jobsSection');
    const jobsList = document.getElementById('jobsList');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    let driverEmail = '';

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      driverEmail = document.getElementById('driverEmail').value.trim();
      if (!driverEmail) {
        loginError.textContent = 'Please enter your email.';
        return;
      }
      try {
        const response = await fetch('https://server-qdh1.onrender.com/driver-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: driverEmail })
        });
        const data = await response.json();
        if (response.ok) {
          showJobs(data.jobs);
          loginSection.style.display = 'none';
          jobsSection.style.display = 'block';
        } else {
          loginError.textContent = data.error || 'Login failed.';
        }
      } catch (err) {
        loginError.textContent = 'Network error. Please try again.';
      }
    });

    assignJobForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const bookingData = {
        pickup: document.getElementById('pickup').value.trim(),
        dropoff: document.getElementById('dropoff').value.trim(),
        datetime: document.getElementById('pickupTime').value,
        vehicleType: document.getElementById('vehicleType').value,
        totalFare: parseFloat(document.getElementById('totalFare').value),
        distanceKm: parseFloat(document.getElementById('distanceKm').value),
        durationMin: parseInt(document.getElementById('durationMin').value, 10),
        notes: document.getElementById('notes').value.trim()
      };

      // Basic validation
      if (!bookingData.pickup || !bookingData.dropoff || !bookingData.datetime || !bookingData.vehicleType || isNaN(bookingData.totalFare) || isNaN(bookingData.distanceKm) || isNaN(bookingData.durationMin)) {
        alert('Please fill out all required fields correctly.');
        return;
      }

      try {
        const response = await fetch('https://server-qdh1.onrender.com/assign-job', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, bookingData })
        });
        const data = await response.json();
        if (response.ok) {
          alert('Job assigned successfully.');
          // Refresh jobs list by re-fetching
          fetchDriverJobs();
          assignJobForm.reset();
        } else {
          alert(data.error || 'Failed to assign job.');
        }
      } catch (err) {
        alert('Network error. Please try again.');
      }
    });

    logoutBtn.addEventListener('click', () => {
      driverEmail = '';
      jobsList.innerHTML = '';
      loginSection.style.display = 'block';
      jobsSection.style.display = 'none';
      loginForm.reset();
    });

    function showJobs(jobs) {
      if (jobs.length === 0) {
        jobsList.innerHTML = '<p>No jobs assigned yet.</p>';
        return;
      }
      jobsList.innerHTML = '';
      jobs.forEach(job => {
        const jobDiv = document.createElement('div');
        jobDiv.style.border = '1px solid #d4af37';
        jobDiv.style.padding = '10px';
        jobDiv.style.marginBottom = '10px';
        jobDiv.style.borderRadius = '6px';
        jobDiv.style.backgroundColor = '#111';

        jobDiv.innerHTML = `
          <p><strong>Pickup:</strong> ${job.bookingData.pickup}</p>
          <p><strong>Dropoff:</strong> ${job.bookingData.dropoff}</p>
          <p><strong>Pickup Time:</strong> ${new Date(job.bookingData.datetime).toLocaleString()}</p>
          <p><strong>Vehicle Type:</strong> ${job.bookingData.vehicleType}</p>
          <p><strong>Driver Payout:</strong> $${job.driverPay.toFixed(2)}</p>
          <p><strong>Notes:</strong> ${job.bookingData.notes || 'None'}</p>
        `;
        jobsList.appendChild(jobDiv);
      });
    }

    async function fetchDriverJobs() {
      if (!driverEmail) return;
      try {
        const response = await fetch('https://server-qdh1.onrender.com/driver-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: driverEmail })
        });
        const data = await response.json();
        if (response.ok) {
          showJobs(data.jobs);
        }
      } catch (err) {
        console.error('Failed to fetch jobs:', err);
      }
    }
  </script>
</body>
</html>

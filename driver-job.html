<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chauffeur de Luxe - Driver Portal</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
  <div id="loginSection">
    <h2>Driver Login</h2>
    <input type="email" id="driverEmail" placeholder="Enter your email" />
    <button id="loginBtn">Login</button>
  </div>

  <div id="dashboard" style="display:none;">
    <h2>Welcome, <span id="driverName"></span></h2>
    <button id="logoutBtn">Logout</button>

    <h3>Pending Jobs</h3>
    <div id="pendingJobs"></div>

    <h3>Completed Jobs</h3>
    <div id="completedJobs"></div>
  </div>

  <script>
    const loginSection = document.getElementById('loginSection');
    const dashboard = document.getElementById('dashboard');
    const driverEmailInput = document.getElementById('driverEmail');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const pendingJobsDiv = document.getElementById('pendingJobs');
    const completedJobsDiv = document.getElementById('completedJobs');
    const driverNameSpan = document.getElementById('driverName');

    let currentDriverEmail = '';

    loginBtn.addEventListener('click', async () => {
      const email = driverEmailInput.value.trim().toLowerCase();
      if (!email) return alert('Please enter your email');
      currentDriverEmail = email;
      await driverLogin(email);
    });

    logoutBtn.addEventListener('click', () => {
      currentDriverEmail = '';
      dashboard.style.display = 'none';
      loginSection.style.display = 'block';
      driverEmailInput.value = '';
    });

    async function driverLogin(email) {
      try {
        const res = await fetch('/driver-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if ((!data.jobs || data.jobs.length === 0) && (!data.completed || data.completed.length === 0)) {
          alert('No jobs found for this driver.');
        }

        driverNameSpan.textContent = email;
        displayPendingJobs(data.jobs || []);
        displayCompletedJobs(data.completed || []);

        loginSection.style.display = 'none';
        dashboard.style.display = 'block';

      } catch (err) {
        console.error('Driver login error:', err);
        alert('Login failed.');
      }
    }

    function displayPendingJobs(jobs) {
      pendingJobsDiv.innerHTML = '';
      if (jobs.length === 0) pendingJobsDiv.innerHTML = '<p>No pending jobs.</p>';

      jobs.forEach(job => {
        const booking = job.bookingData;
        const jobEl = document.createElement('div');
        jobEl.classList.add('jobCard');
        jobEl.innerHTML = `
          <p><strong>Pickup:</strong> ${booking.pickup}</p>
          <p><strong>Dropoff:</strong> ${booking.dropoff}</p>
          <p><strong>Vehicle:</strong> ${booking.vehicleType}</p>
          <p><strong>Time:</strong> ${booking.datetime}</p>
          <p><strong>Distance:</strong> ${booking.distanceKm} km, ${booking.durationMin} min</p>
          <button onclick="respondJob('${job.driverEmail}', '${job.id}', true)">Accept</button>
          <button onclick="respondJob('${job.driverEmail}', '${job.id}', false)">Decline</button>
        `;
        pendingJobsDiv.appendChild(jobEl);
      });
    }

    function displayCompletedJobs(jobs) {
      completedJobsDiv.innerHTML = '';
      if (jobs.length === 0) completedJobsDiv.innerHTML = '<p>No completed jobs.</p>';

      jobs.forEach(job => {
        const booking = job.bookingData || job;
        const jobEl = document.createElement('div');
        jobEl.classList.add('jobCard');
        jobEl.innerHTML = `
          <p><strong>Pickup:</strong> ${booking.pickup}</p>
          <p><strong>Dropoff:</strong> ${booking.dropoff}</p>
          <p><strong>Vehicle:</strong> ${booking.vehicleType}</p>
          <p><strong>Time:</strong> ${booking.datetime}</p>
          <p><strong>Total Fare:</strong> $${booking.totalFare}</p>
          <button onclick="markComplete('${currentDriverEmail}', '${job.id}')">Mark as Completed</button>
        `;
        completedJobsDiv.appendChild(jobEl);
      });
    }

    async function respondJob(driverEmail, jobId, confirmed) {
      try {
        await fetch('/driver-response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, jobId, confirmed })
        });
        alert(`Job ${confirmed ? 'accepted' : 'declined'}`);
        await driverLogin(currentDriverEmail);
      } catch (err) {
        console.error('Respond job error:', err);
        alert('Failed to respond to job.');
      }
    }

    async function markComplete(driverEmail, jobId) {
      try {
        await fetch('/driver-complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ driverEmail, jobId })
        });
        alert('Job marked as completed');
        await driverLogin(currentDriverEmail);
      } catch (err) {
        console.error('Mark complete error:', err);
        alert('Failed to mark job as complete.');
      }
    }
  </script>
</body>
</html>

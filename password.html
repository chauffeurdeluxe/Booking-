<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Driver Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #d4af37;
      text-align: center;
      padding: 40px;
    }
    form {
      display: inline-block;
      background: #111;
      padding: 20px;
      border: 2px solid #d4af37;
      border-radius: 8px;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 250px;
    }
    button {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
    }
    #result {
      margin-top: 15px;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>🔑 Set Driver Password</h1>
  <form id="passwordForm">
    <input type="email" id="email" placeholder="Driver Email" required />
    <input type="password" id="newPassword" placeholder="New Password" required />
    <button type="submit">Set Password</button>
  </form>
  <div id="result"></div>

  <script>
    const form = document.getElementById('passwordForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = 'Processing...';

      const email = document.getElementById('email').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      try {
        const res = await fetch('https://server-qdh1.onrender.com/driver-set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, newPassword })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error setting password');
        result.textContent = '✅ Password set successfully for ' + email;
      } catch (err) {
        console.error(err);
        result.textContent = '❌ Failed: ' + err.message;
      }
    });
  </script>
</body>
</html>

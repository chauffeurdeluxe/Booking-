
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe Booking</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="Chauffeur de Luxe Logo" class="logo"/>
      <h1>Chauffeur de Luxe</h1>
      <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
    </header>

    <form action="https://formspree.io/f/mnnvlnvg" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone" required>

      <label for="vehicleType">Vehicle Type</label>
      <select id="vehicleType" name="vehicleType" required>
      <option value="" disabled selected>Select a vehicle</option>
      <option value="business">Business Class</option>
      <option value="suv">Business Van/SUV</option>
      <option value="first">First Class</option>
      </select>
      
      <label>Pickup Location</label>
      <input type="text" name="pickup" id="pickup" required>

      <label>Dropoff Location</label>
      <input type="text" name="dropoff" id="dropoff" required>

      <label>Pickup Date & Time</label>
      <input type="datetime-local" name="datetime" required>

      <label>Additional Notes</label>
      <textarea name="notes" rows="4" placeholder="Any extra details..."></textarea>

      <p id="fareDisplay" style="font-weight:bold; font-size: 18px; margin-top:10px;">Estimated Fare: $0</p>
      
      <button type="submit">Submit Booking</button>
    </form>

    <div class="thank-you" style="display:none;">
      <h2>Thank you!</h2>
      <p>Your booking request has been received. We’ll be in touch shortly with a quote and a payment link.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chauffeur Booking</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #FFD700; padding: 20px; }
    input, select, button {
      width: 100%; padding: 10px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 4px;
    }
    label { margin-top: 15px; display: block; }
    button {
      background-color: #FFD700; color: #000; font-weight: bold;
      cursor: pointer;
    }
    .fare-display {
      margin-top: 20px; font-size: 1.2em;
    }
  </style>
</head>
<body>

  <h1>CHAUFFEUR DE LUXE BOOKING</h1>

  <form id="bookingForm">
    <label>Name</label>
    <input type="text" id="name" required />

    <label>Email</label>
    <input type="email" id="email" required />

    <label>Phone</label>
    <input type="tel" id="phone" required />

    <label>Pickup Location</label>
    <input type="text" id="pickup" required />

    <label>Dropoff Location</label>
    <input type="text" id="dropoff" required />

    <label>Pickup Date</label>
    <input type="date" id="pickupDate" required />

    <label>Pickup Time</label>
    <input type="time" id="pickupTime" required />

    <label>Vehicle Class</label>
    <select id="vehicleClass" required>
      <option value="">Select...</option>
      <option value="business">Business Class</option>
      <option value="van">Business Van/SUV</option>
      <option value="first">First Class</option>
    </select>

    <div class="fare-display" id="fareDisplay">Estimated Fare: $0</div>

    <button type="button" onclick="calculateFare()">Calculate Fare</button>
    <button type="button" id="payNowBtn">Pay Now</button>
  </form>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7RaWa6dXSoDxXq3DWfeuwHuD-TmI2I9U&libraries=places"></script>
  <script src="https://js.stripe.com/v3/"></script>

  <script>
    let latestFare = 0;
    let pickupAutocomplete, dropoffAutocomplete;

    function initAutocomplete() {
      const options = {
        componentRestrictions: { country: 'au' },
        fields: ['formatted_address', 'geometry'],
      };

      const pickupInput = document.getElementById("pickup");
      const dropoffInput = document.getElementById("dropoff");

      pickupAutocomplete = new google.maps.places.Autocomplete(pickupInput, options);
      dropoffAutocomplete = new google.maps.places.Autocomplete(dropoffInput, options);

      pickupAutocomplete.addListener('place_changed', calculateFare);
      dropoffAutocomplete.addListener('place_changed', calculateFare);
    }

    window.onload = initAutocomplete;

    function calculateFare() {
      const pickup = document.getElementById("pickup").value;
      const dropoff = document.getElementById("dropoff").value;
      const vehicleClass = document.getElementById("vehicleClass").value;
      const pickupTime = document.getElementById("pickupTime").value;

      if (!pickup || !dropoff || !vehicleClass) {
        document.getElementById("fareDisplay").textContent = "Estimated Fare: $0";
        alert("Please fill all required fields.");
        return;
      }

      const service = new google.maps.DistanceMatrixService();

      service.getDistanceMatrix({
        origins: [pickup],
        destinations: [dropoff],
        travelMode: 'DRIVING',
        drivingOptions: {
          departureTime: new Date(),
          trafficModel: 'bestguess'
        },
        unitSystem: google.maps.UnitSystem.METRIC
      }, (response, status) => {
        if (status === 'OK') {
          const element = response.rows[0].elements[0];

          if (element.status === 'OK') {
            const distanceValue = element.distance.value / 1000; // meters to KM

            // Tiered pricing logic
            let fare = 0;
            if (vehicleClass === "business") {
              if (distanceValue <= 6) fare = 124;
              else if (distanceValue <= 20) fare = 188;
              else if (distanceValue <= 40) fare = 250;
              else if (distanceValue <= 60) fare = 310;
              else if (distanceValue <= 80) fare = 370;
              else if (distanceValue <= 100) fare = 450;
              else fare = 0;
            } else if (vehicleClass === "van") {
              if (distanceValue <= 6) fare = 184;
              else if (distanceValue <= 20) fare = 250;
              else if (distanceValue <= 40) fare = 320;
              else if (distanceValue <= 60) fare = 390;
              else if (distanceValue <= 80) fare = 460;
              else if (distanceValue <= 100) fare = 540;
              else fare = 0;
            } else if (vehicleClass === "first") {
              if (distanceValue <= 6) fare = 220;
              else if (distanceValue <= 20) fare = 300;
              else if (distanceValue <= 40) fare = 380;
              else if (distanceValue <= 60) fare = 450;
              else if (distanceValue <= 80) fare = 520;
              else if (distanceValue <= 100) fare = 600;
              else fare = 0;
            }

            // Airport parking fee if pickup or dropoff contains "airport"
            const airportRegex = /airport/i;
            const parkingFee = airportRegex.test(pickup) || airportRegex.test(dropoff) ? 14 : 0;

            // Early/late surcharge before 6AM or after 10PM
            let earlyLateFee = 0;
            if (pickupTime) {
              const selectedHour = new Date(`1970-01-01T${pickupTime}:00`).getHours();
              if (selectedHour < 6 || selectedHour >= 22) {
                earlyLateFee = 30;
              }
            }

            const totalFare = fare + parkingFee + earlyLateFee;
            latestFare = totalFare;

            document.getElementById("fareDisplay").textContent =
              totalFare > 0 ? `Estimated Fare: $${totalFare.toFixed(2)}` : "Contact us for a custom quote.";
          } else {
            console.error('Distance Matrix element status:', element.status);
            document.getElementById("fareDisplay").textContent = "Error calculating fare";
          }
        } else {
          console.error('Distance Matrix status:', status);
          document.getElementById("fareDisplay").textContent = "Error calculating fare";
        }
      });
    }

    // Event listeners for recalculating fare on change
    document.getElementById("vehicleClass").addEventListener("change", calculateFare);
    document.getElementById("pickupTime").addEventListener("change", calculateFare);

    // Stripe Payment Redirection
    document.getElementById("payNowBtn").addEventListener("click", async function(event) {
      event.preventDefault();

      if (!latestFare || latestFare <= 0) {
        alert("Please calculate fare before proceeding to payment.");
        return;
      }

      const amountInCents = Math.round(latestFare * 100);

      try {
        const response = await fetch('https://server-qdh1.onrender.com/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: amountInCents })
        });

        if (!response.ok) throw new Error("Failed to connect to payment server.");

        const session = await response.json();

        if (session.id) {
          const stripe = Stripe('pk_test_51RekxBAc65pROHTAjbmaqX0wL5TLUVaAOQe59PEgdTPBf2DIe1PNpGlm8LJl8mGThvXBrsI4OptShqGhcwyrVV3700XS1XJGck');
          const { error } = await stripe.redirectToCheckout({ sessionId: session.id });
          if (error) {
            console.error(error);
            alert("Payment redirect failed. Please try again.");
          }
        } else {
          alert("Payment session could not be created.");
        }
      } catch (error) {
        console.error("Stripe error:", error);
        alert("Payment failed. Please try again.");
      }
    });
  </script>

</body>
</html>

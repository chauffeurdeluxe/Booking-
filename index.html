<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe Booking</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="script.js" defer></script>
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMj6AZh1U0ijO-34GjHo3k66g3Q8vqMew&libraries=places&callback=initAutocomplete"
  async defer
></script>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="Chauffeur de Luxe Logo" class="logo"/>
      <h1>Chauffeur de Luxe</h1>
      <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
    </header>

    <form id="bookingForm">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone" required>

      <label for="vehicleType">Vehicle Type</label>
      <select id="vehicleType" name="vehicleType" required>
        <option value="" disabled selected>Select a vehicle</option>
        <option value="business">Business Class</option>
        <option value="suv">Business Van/SUV</option>
        <option value="first">First Class</option>
      </select>

      <label>Pickup Location</label>
      <input type="text" id="pickup" name="pickup" required>

      <label>Dropoff Location</label>
      <input type="text" id="dropoff" name="dropoff" required>

      <label>Pickup Date & Time</label>
      <input type="datetime-local" id="pickupTime" name="datetime" required>

      <label>Additional Notes</label>
      <textarea name="notes" rows="4" placeholder="Any extra details..."></textarea>

      <p id="fareDisplay" style="font-weight:bold; font-size: 18px; margin-top:10px;">Estimated Fare: $0</p>

      <button type="button" id="payNow">Pay Now</button>
    </form>

    <div class="thank-you" style="display:none;">
      <h2>Thank you!</h2>
      <p>Your booking and payment have been received.</p>
    </div>
  </div>

  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chauffeur de Luxe</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chauffeur de Luxe" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" type="image/png" />

  <!--
    Make sure initAutocomplete exists globally before Google Maps calls it.
    This prevents a race where Google tries to call the callback before
    the function is defined.
  -->
  <script>
    // Define placeholder global function so Google script can call it reliably.
    // The real implementation below overwrites window.initAutocomplete.
    window.initAutocomplete = function () {
      // placeholder - real function will be assigned later
      console.debug('initAutocomplete placeholder called');
    };
  </script>

  <!-- Google Maps (keeps your API key as sent). callback=initAutocomplete will call the global function above -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7RaWa6dXSoDxXq3DWfeuwHuD-TmI2I9U&libraries=places&callback=initAutocomplete" async defer></script>

  <style>
    /* Tab styles */
    .tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0;
      padding: 0 10px;
    }
    .tab-button {
      padding: 10px 18px;
      background: black;
      color: gold;
      border: 2px solid #FFD700;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: background .15s ease, color .15s ease;
    }
    .tab-button.active {
      background: #FFD700;
      color: #000;
    }

    /* Ensure only active tab-content shows */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Make forms look consistent */
    form input, form select, form textarea, form button {
      font-family: inherit;
    }

    /* Loading spinner slight centering */
    #loadingSpinner {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      z-index: 9999;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 5px solid #fff;
      border-top-color: #FFD700;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <img src="icon.png" alt="Chauffeur de Luxe Logo" />
      <h1>Chauffeur De Luxe</h1>
    </div>
    <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
  </header>

  <main>
    <!-- Tabs: place this above your booking form -->
    <div class="tab-container" role="tablist" aria-label="Booking types">
      <button type="button" id="tabPoint" class="tab-button active" aria-controls="pointToPointForm" aria-selected="true">Point-to-Point</button>
      <button type="button" id="tabHourly" class="tab-button" aria-controls="hourlyForm" aria-selected="false">By the Hour</button>
    </div>

    <!-- POINT-TO-POINT: your existing form wrapped (UNCHANGED CONTENT) -->
    <div id="pointToPointForm" class="tab-content active" aria-hidden="false">
      <form id="bookingForm">
        <input type="text" id="name" name="name" placeholder="Full Name" required />
        <input type="email" id="email" name="email" placeholder="Email" required />
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" required />

        <select id="vehicleType" required>
          <option value="">Select Vehicle Class</option>
          <option value="business">Business Class</option>
          <option value="suv">Business Van/SUV</option>
          <option value="first">First Class</option>
        </select>

        <input type="text" id="pickup" placeholder="Pickup Location" required />
        <input type="text" id="dropoff" placeholder="Dropoff Location" required />

        <div class="form-group">
          <label for="pickupTime" style="display:block; margin-bottom:6px; color:#FFD700; font-weight:bold;">
            Pickup Date & Time
          </label>
          <input type="datetime-local" id="pickupTime" required />
        </div>

        <textarea
          id="notes"
          name="notes"
          placeholder="Any special instructions or requests?"
          rows="2"
          style="width: 100%; max-width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; font-size: 16px;"
        ></textarea>

        <button type="button" id="calculateFare">Calculate Fare</button>
        <div id="fareSummary"></div>

        <button type="button" id="payNow">Pay Now</button>
      </form>
    </div>

        <!-- HOURLY BOOKING: new form (separate IDs) -->
    <div id="hourlyForm" class="tab-content" aria-hidden="true">
      <form id="hourlyBookingForm">
        <input type="text" id="hourlyName" name="name" placeholder="Full Name" required />
        <input type="email" id="hourlyEmail" name="email" placeholder="Email" required />
        <input type="tel" id="hourlyPhone" name="phone" placeholder="Phone Number" required />

        <select id="hourlyVehicleType" required>
          <option value="">Select Vehicle Class</option>
          <option value="business">Business Class</option>
          <option value="suv">Business Van/SUV</option>
          <option value="first">First Class</option>
        </select>

        <input 
  type="number" 
  id="hours" 
  name="hours" 
  min="1" 
  max="12" 
  placeholder="Number of Hours" 
  required/>

        <input type="text" id="hourlyPickup" placeholder="Pickup Location" required />

        <div class="form-group">
          <label for="hourlyPickupTime" style="display:block; margin-bottom:6px; color:#FFD700; font-weight:bold;">
            Pickup Date & Time
          </label>
          <input type="datetime-local" id="hourlyPickupTime" required />
        </div>

        <textarea
        id="hourlyNotes"
        name="hourlyNotes"
        placeholder="Any special instructions or requests?"
        rows="2"
        style="width: 100%; max-width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; font-size: 16px;"
        ></textarea>

        <button type="button" id="calculateHourlyFare">Calculate Fare</button>
        <div id="hourlyFareSummary"></div>

        <button type="button" id="payHourlyNow">Pay Now</button>
      </form>
    </div>
  </main>

  <!-- Loading spinner overlay -->
  <div id="loadingSpinner">
    <div class="spinner"></div>
  </div>

  <script>
    // ---------------------------
    // Robust initAutocomplete implementation
    // - ensures DOM is ready
    // - defines autocomplete for pickup, dropoff and hourlyPickup
    // ---------------------------
    window.initAutocomplete = function () {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.initAutocomplete);
        return;
      }

      try {
        const pickupInput = document.getElementById('pickup');
        const dropoffInput = document.getElementById('dropoff');
        const hourlyPickupInput = document.getElementById('hourlyPickup');

        if (pickupInput) {
          new google.maps.places.Autocomplete(pickupInput, { componentRestrictions: { country: 'au' } });
        }
        if (dropoffInput) {
          new google.maps.places.Autocomplete(dropoffInput, { componentRestrictions: { country: 'au' } });
        }
        if (hourlyPickupInput) {
          new google.maps.places.Autocomplete(hourlyPickupInput, { componentRestrictions: { country: 'au' } });
        }

        console.debug('Google Places Autocomplete initialized');
      } catch (err) {
        console.warn('initAutocomplete error', err);
      }
    };

    // ---------------------------
    // Main page behavior — attach listeners on DOMContentLoaded
    // ---------------------------
    document.addEventListener('DOMContentLoaded', function () {
      const API_BASE = 'https://server-qdh1.onrender.com';
      const tabPointBtn = document.getElementById('tabPoint');
      const tabHourlyBtn = document.getElementById('tabHourly');
      const pointDiv = document.getElementById('pointToPointForm');
      const hourlyDiv = document.getElementById('hourlyForm');
      const calculateBtn = document.getElementById('calculateFare');
      const payBtn = document.getElementById('payNow');
      const calculateHourlyBtn = document.getElementById('calculateHourlyFare');
      const payHourlyBtn = document.getElementById('payHourlyNow');
      const fareSummary = document.getElementById('fareSummary');
      const hourlyFareSummary = document.getElementById('hourlyFareSummary');
      const loadingSpinner = document.getElementById('loadingSpinner');

      function showTab(tabName) {
        if (tabName === 'point') {
          pointDiv.classList.add('active');
          hourlyDiv.classList.remove('active');
          tabPointBtn.classList.add('active');
          tabHourlyBtn.classList.remove('active');
        } else {
          hourlyDiv.classList.add('active');
          pointDiv.classList.remove('active');
          tabHourlyBtn.classList.add('active');
          tabPointBtn.classList.remove('active');
        }
      }

      tabPointBtn.addEventListener('click', () => showTab('point'));
      tabHourlyBtn.addEventListener('click', () => showTab('hourly'));

      // Ensure initial tab is point
      showTab('point');

      // Helper to show/hide spinner
      function setSpinner(show) {
        loadingSpinner.style.display = show ? 'flex' : 'none';
      }

      // ---------------------------
      // Calculate point-to-point fare
      // ---------------------------
      calculateBtn.addEventListener('click', function () {
        try {
          const vehicleType = document.getElementById('vehicleType').value;
          const pickup = document.getElementById('pickup').value;
          const dropoff = document.getElementById('dropoff').value;
          const pickupTime = document.getElementById('pickupTime').value;

          if (!pickup || !dropoff || !vehicleType || !pickupTime) {
            alert('Please fill in pickup, dropoff, vehicle type, and pickup time.');
            return;
          }

          const service = new google.maps.DistanceMatrixService();
          service.getDistanceMatrix({
            origins: [pickup],
            destinations: [dropoff],
            travelMode: 'DRIVING',
            unitSystem: google.maps.UnitSystem.METRIC,
          }, function (response, status) {
            if (status !== 'OK') {
              console.error('DistanceMatrix status:', status);
              alert('Error calculating distance: ' + status);
              return;
            }

            const el = response.rows[0].elements[0];
            if (el.status !== 'OK') {
              alert('Could not calculate distance for the provided locations.');
              return;
            }

            const distanceKm = parseFloat(el.distance.text.replace(/[^0-9.]/g, ''));
            const durationMin = el.duration.value / 60; // convert seconds to minutes
 

           // Pricing logic
           const perKmRate = 2.50; // rate for distance <= 20km
           const perMinRate = 0.70;

           const multipliers = {
           business: 1.0,
           suv: 1.2,
           first: 1.5
           };

           const minFare = {
           business: 100,
           suv: 135,
           first: 200
           };

          // Declare fare variables
          let fareCore;
          let fare;

         // Under 10 km: flat fare
         if (distanceKm < 10) {
         fare = 130; // fixed, no GST/tax/profit added
         } else {
         // Over 10 km: start with $50, add per km + per min charges
         fareCore = 55 + (distanceKm * perKmRate + durationMin * perMinRate);
  
         // Apply vehicle multiplier
         fareCore *= multipliers[vehicleType];

         // Ensure vehicle minimum fare
         fareCore = Math.max(fareCore, minFare[vehicleType]);

         // Apply GST, tax, and profit
         const gstRate = 0.10;
         const taxRate = 0.10;
         const profitRate = 0.25;
         fare = fareCore * (1 + gstRate + taxRate + profitRate);
         }

        // Early/Late pickup surcharge
        const pickupHour = new Date(pickupTime).getHours();
        if (pickupHour < 5 || pickupHour >= 22) fare += 30;

        // Airport surcharge
        if (pickup.toLowerCase().includes("airport")) {
        if (pickup.toLowerCase().includes("domestic")) fare += 9;
        else fare += 14;
        }

       // Round fare
       fare = fare.toFixed(2);

       // Update fare summary
       fareSummary.innerHTML = `
       <div>Estimated Fare: $${fare}</div>
       <div>Distance: ${distanceKm.toFixed(2)} km</div>
       <div>Estimated Time: ${durationMin.toFixed(0)} min</div>
       `;

       fareSummary.setAttribute('data-fare', fare);
       fareSummary.setAttribute('data-distance', distanceKm.toFixed(2));
       fareSummary.setAttribute('data-duration', durationMin.toFixed(0));

       console.debug('Fare calculated', { fare, distanceKm, durationMin });
          });
        } catch (err) {
          console.error('calculateFare error', err);
          alert('Error calculating fare; see console for details.');
        }
        });

               // ---------------------------
      // Pay now (point-to-point)
      // ---------------------------
      payBtn.addEventListener('click', async function () {
        setSpinner(true);
        try {
          const name = document.getElementById('name').value;
          const phone = document.getElementById('phone').value;
          const email = document.getElementById('email').value;
          const pickup = document.getElementById('pickup').value;
          const dropoff = document.getElementById('dropoff').value;
          const pickupTime = document.getElementById('pickupTime').value;
          const vehicleType = document.getElementById('vehicleType').value;
          const notes = document.getElementById('notes').value;

          const fare = fareSummary.getAttribute('data-fare');
          const distanceKm = fareSummary.getAttribute('data-distance');
          const durationMin = fareSummary.getAttribute('data-duration');

          if (!name || !phone || !email || !pickup || !dropoff || !pickupTime || !vehicleType || !fare) {
            setSpinner(false);
            alert('Please fill out all details and calculate fare before proceeding.');
            return;
          }

          const bookingData = {
            name,
            phone,
            email,
            pickup,
            dropoff,
            datetime: pickupTime,
            vehicleType,
            totalFare: parseFloat(fare),
            distanceKm,
            durationMin,
            notes,
            bookingType: 'point-to-point'
          };

          console.debug('Creating checkout session for', bookingData);

          const response = await fetch(`${API_BASE}/create-checkout-session`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingData),
          });

          const data = await response.json();
          if (response.ok && data.url) {
            // redirect to Stripe Checkout
            window.location.href = data.url;
            return;
          }

          // otherwise show error
          console.error('create-checkout-session failed', data);
          alert('Payment session failed. Please check console & server logs.');
        } catch (err) {
          console.error('payNow error', err);
          alert('Something went wrong. Please try again.');
        } finally {
          setSpinner(false);
        }
      });

      // ---------------------------
      // HOURLY: calculation and Stripe
      // ---------------------------
      calculateHourlyBtn.addEventListener('click', function () {
        const vehicleType = document.getElementById('hourlyVehicleType').value;
        const hours = parseInt(document.getElementById('hours').value, 10);

        if (!vehicleType || !hours || hours < 1) {
          alert('Please select a vehicle type and enter a valid number of hours.');
          return;
        }

        const rates = {
          business: 150,
          suv: 200,
          first: 250
        };

        const fare = rates[vehicleType] * hours;

        hourlyFareSummary.innerHTML = `
          Estimated Fare: $${fare.toFixed(2)} for ${hours} hour(s)
        `;

        hourlyFareSummary.setAttribute('data-fare', fare.toFixed(2));
        hourlyFareSummary.setAttribute('data-hours', hours);
      });

      payHourlyBtn.addEventListener('click', async function () {
        setSpinner(true);
        try {
          const name = document.getElementById('hourlyName').value;
          const phone = document.getElementById('hourlyPhone').value;
          const email = document.getElementById('hourlyEmail').value;
          const pickup = document.getElementById('hourlyPickup').value;
          const pickupTime = document.getElementById('hourlyPickupTime').value;
          const vehicleType = document.getElementById('hourlyVehicleType').value;
          const hours = parseInt(document.getElementById('hours').value, 10);
          const notes = document.getElementById('hourlyNotes').value;

          const fare = hourlyFareSummary.getAttribute('data-fare');
          if (!name || !phone || !email || !pickup || !pickupTime || !vehicleType || !fare) {
            setSpinner(false);
            alert('Please fill out all details and calculate fare before proceeding.');
            return;
          }

          const bookingData = {
            name,
            phone,
            email,
            pickup,
            dropoff: "Hourly Booking",
            datetime: pickupTime,
            vehicleType,
            hours,
            notes,
            totalFare: parseFloat(fare),
            distanceKm: 0,
            durationMin: hours * 60,
            bookingType: 'hourly'
          };

          console.debug('Creating hourly checkout session for', bookingData);

          const response = await fetch(`${API_BASE}/create-checkout-session`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingData),
          });

          const data = await response.json();
          if (response.ok && data.url) {
            window.location.href = data.url;
            return;
          }
          console.error('create-checkout-session (hourly) failed', data);
          alert('Payment session failed. Please check console & server logs.');
        } catch (err) {
          console.error('payHourlyNow error', err);
          alert('Something went wrong. Please try again.');
        } finally {
          setSpinner(false);
        }
      });

      // Hide spinner on normal page load and when coming back from Stripe cancel
      function hideSpinner() {
        setSpinner(false);
      }
      hideSpinner();
      window.addEventListener('pageshow', function(event) {
        if (event.persisted) hideSpinner();
      });
    }); // end DOMContentLoaded
  </script>
</body>
</html>

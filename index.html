<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe Booking</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7RaWa6dXSoDxXq3DWfeuwHuD-TmI2I9U&libraries=places&callback=initAutocomplete" async defer></script>
</head>
<body>
  <h1>Chauffeur Booking</h1>
  <form id="booking-form">
    <label>Name: <input type="text" name="name" required /></label><br>
    <label>Email: <input type="email" name="email" required /></label><br>
    <label>Phone: <input type="tel" name="phone" required /></label><br>
    <label>Vehicle Type:
      <select name="vehicle" id="vehicle-type" required>
        <option value="business">Business Class</option>
        <option value="suv">Business SUV</option>
        <option value="first">First Class</option>
      </select>
    </label><br>
    <label>Pickup Location: <input id="pickup" name="pickup" required /></label><br>
    <label>Dropoff Location: <input id="dropoff" name="dropoff" required /></label><br>
    <label>Pickup Date: <input type="date" name="date" required /></label><br>
    <label>Pickup Time: <input type="time" name="time" required /></label><br>
    <label>Notes: <textarea name="notes"></textarea></label><br>
    <p id="fare-display">Estimated Fare: $0</p>
    <button type="button" id="pay-now">Pay Now</button>
  </form>

  <script src="script.js"></script>
</body>
</html>

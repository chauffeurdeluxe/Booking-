<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur Booking</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-BEJyiMYlZ8MxHZWDKnvPPuTx-WtTXiw&libraries=places"></script>
</head>
<body>
  <div class="container">
    <h1>Chauffeur Booking</h1>
    <form id="booking-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required />

      <label for="vehicleClass">Vehicle Class</label>
      <select id="vehicleClass" required>
        <option value="">Select</option>
        <option value="business">Business Class</option>
        <option value="van">Business Van/SUV</option>
        <option value="first">First Class</option>
      </select>

      <label for="pickup">Pickup Location</label>
      <input type="text" id="pickup" required />

      <label for="dropoff">Dropoff Location</label>
      <input type="text" id="dropoff" required />

      <label for="date">Pickup Date</label>
      <input type="date" id="date" required />

      <label for="time">Pickup Time</label>
      <input type="time" id="time" required />

      <p><strong>Total Fare (AUD): $<span id="fare">0.00</span></strong></p>

      <button type="submit" id="payBtn">Pay Now</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>

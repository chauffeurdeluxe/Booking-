
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe Booking</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <img src="logo.png" alt="Chauffeur de Luxe Logo" class="logo"/>
      <h1>Chauffeur de Luxe</h1>
      <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
    </header>

    <form action="https://formspree.io/f/mnnvlnvg" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone" required>

      <label for="vehicleType">Vehicle Type</label>
      <select id="vehicleType" name="vehicleType" required>
      <option value="" disabled selected>Select a vehicle</option>
      <option value="business">Business Class</option>
      <option value="suv">Business Van/SUV</option>
      <option value="first">First Class</option>
      </select>
      
      <label>Pickup Location</label>
      <input type="text" name="pickup" id="pickup" required>

      <label>Dropoff Location</label>
      <input type="text" name="dropoff" id="dropoff" required>

      <label>Pickup Date & Time</label>
      <input type="datetime-local" name="datetime" required>

      <label>Additional Notes</label>
      <textarea name="notes" rows="4" placeholder="Any extra details..."></textarea>

      <p id="fareDisplay" style="font-weight:bold; font-size: 18px; margin-top:10px;">Estimated Fare: $0</p>
      
      <button type="submit">Submit Booking</button>
    </form>

    <div class="thank-you" style="display:none;">
      <h2>Thank you!</h2>
      <p>Your booking request has been received. We’ll be in touch shortly with a quote and a payment link.</p>
    </div>
  </div>

 <script>
  let distanceInKm = 0;

  function initMap() {
    const options = {
      componentRestrictions: { country: 'au' },
      fields: ['formatted_address', 'geometry'],
    };

    const pickupInput = document.getElementById("pickup");
    const dropoffInput = document.getElementById("dropoff");

    new google.maps.places.Autocomplete(pickupInput, options);
    new google.maps.places.Autocomplete(dropoffInput, options);
  }

  async function calculateDistanceAndFare() {
    const pickup = document.getElementById("pickup").value;
    const dropoff = document.getElementById("dropoff").value;
    const vehicleType = document.getElementById("vehicleType").value;

    if (!pickup || !dropoff || !vehicleType) return;

    const service = new google.maps.DistanceMatrixService();

    service.getDistanceMatrix({
      origins: [pickup],
      destinations: [dropoff],
      travelMode: 'DRIVING',
      drivingOptions: {
        departureTime: new Date(),
        trafficModel: 'bestguess'
      },
      unitSystem: google.maps.UnitSystem.METRIC
    }, (response, status) => {
      if (status === 'OK') {
        const element = response.rows[0].elements[0];

        if (element.status === 'OK') {
          const distanceValue = element.distance.value / 1000; // meters to KM
          distanceInKm = distanceValue;

          const fare = calculateTieredFare(distanceValue, vehicleType);
          document.getElementById("fareDisplay").textContent = `Estimated Fare: $${fare}`;
        }
      }
    });
  }

  function calculateTieredFare(km, type) {
    let fare = 0;

    const pricing = {
      business: [124, 188, 250, 310, 370, 450],
      suv: [184, 250, 320, 390, 460, 540],
      first: [220, 300, 380, 450, 520, 600]
    };

    const tiers = [6, 20, 40, 60, 80, 100];
    const rates = pricing[type] || [];

    for (let i = 0; i < tiers.length; i++) {
      if (km <= tiers[i]) return rates[i];
    }

    return "Custom Quote";
  }

  document.getElementById("pickup").addEventListener("change", calculateDistanceAndFare);
  document.getElementById("dropoff").addEventListener("change", calculateDistanceAndFare);
  document.getElementById("vehicleType").addEventListener("change", calculateDistanceAndFare);
</script>

<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDfdmX
</body>
</html>

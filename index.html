<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe - Booking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>CHAUFFEUR DE LUXE</h1>
    <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
  </header>

  <main>
    <form action="mailto:chauffeurdeluxe@yahoo.com" method="POST" enctype="text/plain" onsubmit="redirectToWhatsApp()">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="pickup">Pickup Location</label>
      <input type="text" id="pickup" name="pickup" required />

      <label for="dropoff">Dropoff Location</label>
      <input type="text" id="dropoff" name="dropoff" required />

      <label for="datetime">Pickup Date & Time</label>
      <input type="datetime-local" id="datetime" name="datetime" required />

      <button type="submit">Submit Booking</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Chauffeur de Luxe</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>

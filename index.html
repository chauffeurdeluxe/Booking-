<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur Booking</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #FFD700; padding: 20px; }
    input, select, button {
      width: 100%; padding: 10px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 4px;
    }
    label { margin-top: 15px; display: block; }
    button {
      background-color: #FFD700; color: #000; font-weight: bold;
      cursor: pointer;
    }
    .fare-display {
      margin-top: 20px; font-size: 1.2em;
    }
  </style>
</head>
<body>

  <h1>CHAUFFEUR DE LUXE BOOKING</h1>

  <form id="bookingForm">
    <label>Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Phone</label>
    <input type="tel" id="phone" required>

    <label>Pickup Location</label>
    <input type="text" id="pickup" required>

    <label>Dropoff Location</label>
    <input type="text" id="dropoff" required>

    <label>Pickup Date</label>
    <input type="date" id="pickupDate" required>

    <label>Pickup Time</label>
    <input type="time" id="pickupTime" required>

    <label>Vehicle Class</label>
    <select id="vehicleClass" required>
      <option value="">Select...</option>
      <option value="business">Business Class</option>
      <option value="van">Business Van/SUV</option>
      <option value="first">First Class</option>
    </select>

    <div class="fare-display">
      Estimated Fare: <span id="fareDisplay">$0.00</span>
    </div>

    <button type="button" onclick="calculateFare()">Calculate Fare</button>
    <button type="button" id="payNowBtn">Pay Now</button>
  </form>

  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places"></script>
  <script src="https://js.stripe.com/v3/"></script>

  <script>
    let latestFare = 0;

    function initAutocomplete() {
      new google.maps.places.Autocomplete(document.getElementById('pickup'));
      new google.maps.places.Autocomplete(document.getElementById('dropoff'));
    }

    window.onload = initAutocomplete;

    function calculateFare() {
      const pickup = document.getElementById('pickup').value;
      const dropoff = document.getElementById('dropoff').value;
      const vehicleClass = document.getElementById('vehicleClass').value;
      const pickupTime = document.getElementById('pickupTime').value;

      if (!pickup || !dropoff || !vehicleClass) {
        alert("Please fill all required fields.");
        return;
      }

      const service = new google.maps.DistanceMatrixService();
      service.getDistanceMatrix({
        origins: [pickup],
        destinations: [dropoff],
        travelMode: 'DRIVING',
        unitSystem: google.maps.UnitSystem.METRIC,
      }, function(response, status) {
        if (status !== 'OK') {
          alert('Error: ' + status);
        } else {
          const distanceText = response.rows[0].elements[0].distance.text;
          const distanceKm = parseFloat(distanceText.replace(" km", ""));

          let fare = 0;

          // Tiered pricing
          const pricing = {
            business:   [124, 188, 250, 310, 370, 450],
            van:        [184, 250, 320, 390, 460, 540],
            first:      [220, 300, 380, 450, 520, 600]
          };

          const tiers = [6, 20, 40, 60, 80, 100];
          const classPricing = pricing[vehicleClass];

          for (let i = 0; i < tiers.length; i++) {
            if (distanceKm <= tiers[i]) {
              fare = classPricing[i];
              break;
            }
          }

          if (distanceKm > 100) {
            alert("For trips over 100 km, please contact us for a custom quote.");
            fare = 0;
          }

          // Early/late fee
          const [hour] = pickupTime.split(':').map(Number);
          if (hour < 6 || hour >= 22) {
            fare += 30;
          }

          // Airport pickup fee only
          const airportRegex = /airport/i;
          if (airportRegex.test(pickup)) {
            fare += 14;
          }

          latestFare = fare;
          document.getElementById("fareDisplay").textContent = `$${fare.toFixed(2)}`;
        }
      });
    }

    document.getElementById("payNowBtn").addEventListener("click", async function(event) {
      event.preventDefault();

      if (!latestFare || latestFare <= 0) {
        alert("Please calculate fare before proceeding to payment.");
        return;
      }

      const amountInCents = Math.round(latestFare * 100);

      try {
        const response = await fetch('/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: amountInCents })
        });

        const session = await response.json();

        if (session.id) {
          const stripe = Stripe('YOUR_PUBLISHABLE_KEY'); // Replace with your real key
          await stripe.redirectToCheckout({ sessionId: session.id });
        } else {
          alert("Payment session could not be created.");
        }
      } catch (error) {
        console.error("Stripe error:", error);
        alert("Payment failed. Please try again.");
      }
    });
  </script>

</body>
</html>

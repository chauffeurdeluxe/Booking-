
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chauffeur de Luxe – Booking Form</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Chauffeur de Luxe Logo" class="logo">
    <h1>Booking</h1>
    <form id="booking-form">
      <label>Name:</label>
      <input type="text" name="name" required>

      <label>Phone:</label>
      <input type="tel" name="phone" required>

      <label>Email:</label>
      <input type="email" name="email" required>

      <label>Vehicle Class:</label>
      <select name="vehicle" id="vehicle" required>
        <option value="business">Business Class</option>
        <option value="van">Business Van/SUV</option>
        <option value="first">First Class</option>
      </select>

      <label>Pickup Location:</label>
      <input type="text" id="pickup" required>

      <label>Dropoff Location:</label>
      <input type="text" id="dropoff" required>

      <label>Pickup Date & Time:</label>
      <input type="datetime-local" name="datetime" required>

      <label>Flight Details (Optional):</label>
      <input type="text" name="flight">

      <button type="submit">Calculate Fare & Pay</button>
    </form>
    <div id="fare-details"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe Booking</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>Chauffeur de Luxe</h1>
      <p class="tagline">Driven by Distinction. Defined by Elegance.</p>
    </header>

    <form action="https://formspree.io/f/mnnvlnvg" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone" required>

      <label for="vehicleType">Vehicle Type</label>
      <select id="vehicleType" name="vehicleType" required>
        <option value="" disabled selected>Select a vehicle</option>
        <option value="business">Business Class</option>
        <option value="suv">Business Van/SUV</option>
        <option value="first">First Class</option>
      </select>

      <label>Pickup Location</label>
      <input type="text" name="pickup" id="pickup" required>

      <label>Dropoff Location</label>
      <input type="text" name="dropoff" id="dropoff" required>

      <label>Pickup Date & Time</label>
      <input type="datetime-local" name="datetime" id="datetime" required>

      <label>Additional Notes</label>
      <textarea name="notes" rows="4" placeholder="Any extra details..."></textarea>

      <p id="fareDisplay" style="font-weight:bold; font-size: 18px; margin-top:10px;">Estimated Fare: $0</p>

      <button type="button" id="payNowBtn">Pay Now</button>
    </form>

    <div class="thank-you" style="display:none;">
      <h2>Thank you!</h2>
      <p>Your booking and payment have been received successfully. A confirmation has been sent to your email. We’ll see you soon!</p>
    </div>
  </div>

  <script>
    let latestFare = 0;
    let pickupAutocomplete, dropoffAutocomplete;

    function initMap() {
      const options = {
        componentRestrictions: { country: 'au' },
        fields: ['formatted_address', 'geometry'],
      };

      const pickupInput = document.getElementById("pickup");
      const dropoffInput = document.getElementById("dropoff");

      pickupAutocomplete = new google.maps.places.Autocomplete(pickupInput, options);
      dropoffAutocomplete = new google.maps.places.Autocomplete(dropoffInput, options);

      pickupAutocomplete.addListener('place_changed', calculateDistanceAndFare);
      dropoffAutocomplete.addListener('place_changed', calculateDistanceAndFare);
    }

    function calculateDistanceAndFare() {
      const pickup = document.getElementById("pickup").value;
      const dropoff = document.getElementById("dropoff").value;
      const vehicleType = document.getElementById("vehicleType").value;
      const datetimeValue = document.getElementById("datetime").value;

      if (!pickup || !dropoff || !vehicleType) {
        document.getElementById("fareDisplay").textContent = "Estimated Fare: $0";
        return;
      }

      const service = new google.maps.DistanceMatrixService();

      service.getDistanceMatrix({
        origins: [pickup],
        destinations: [dropoff],
        travelMode: 'DRIVING',
        drivingOptions: {
          departureTime: new Date(),
          trafficModel: 'bestguess'
        },
        unitSystem: google.maps.UnitSystem.METRIC
      }, (response, status) => {
        if (status === 'OK') {
          const element = response.rows[0].elements[0];

          if (element.status === 'OK') {
            const distanceValue = element.distance.value / 1000; // meters to KM

            // Tiered pricing logic
            let fare = 0;
            if (vehicleType === "business") {
              if (distanceValue <= 6) fare = 124;
              else if (distanceValue <= 20) fare = 188;
              else if (distanceValue <= 40) fare = 250;
              else if (distanceValue <= 60) fare = 310;
              else if (distanceValue <= 80) fare = 370;
              else if (distanceValue <= 100) fare = 450;
              else fare = 0;
            } else if (vehicleType === "suv") {
              if (distanceValue <= 6) fare = 184;
              else if (distanceValue <= 20) fare = 250;
              else if (distanceValue <= 40) fare = 320;
              else if (distanceValue <= 60) fare = 390;
              else if (distanceValue <= 80) fare = 460;
              else if (distanceValue <= 100) fare = 540;
              else fare = 0;
            } else if (vehicleType === "first") {
              if (distanceValue <= 6) fare = 220;
              else if (distanceValue <= 20) fare = 300;
              else if (distanceValue <= 40) fare = 380;
              else if (distanceValue <= 60) fare = 450;
              else if (distanceValue <= 80) fare = 520;
              else if (distanceValue <= 100) fare = 600;
              else fare = 0;
            }

            // Airport parking fee if either pickup or dropoff contains "airport"
            const airportRegex = /airport/i;
            const parkingFee = airportRegex.test(pickup) ? 14 : 0;

            // Early/late surcharge before 6AM or after 10PM
            let earlyLateFee = 0;
            if (datetimeValue) {
              const selectedHour = new Date(datetimeValue).getHours();
              if (selectedHour < 6 || selectedHour >= 22) {
                earlyLateFee = 30;
              }
            }

            const totalFare = fare + parkingFee + earlyLateFee;
            latestFare = totalFare;

            document.getElementById("fareDisplay").textContent =
              totalFare > 0 ? `Estimated Fare: $${totalFare}` : "Contact us for a custom quote.";
          } else {
            console.error('Distance Matrix element status:', element.status);
            document.getElementById("fareDisplay").textContent = "Error calculating fare";
          }
        } else {
          console.error('Distance Matrix status:', status);
          document.getElementById("fareDisplay").textContent = "Error calculating fare";
        }
      });
    }

    // Event listeners for recalculating fare
    document.getElementById("vehicleType").addEventListener("change", calculateDistanceAndFare);
    document.getElementById("datetime").addEventListener("change", calculateDistanceAndFare);

  </script>

  <!-- GOOGLE MAPS API -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7RaWa6dXSoDxXq3DWfeuwHuD-TmI2I9U&libraries=places&callback=initMap">
  </script>

<script>
  document.getElementById("payNowBtn").addEventListener("click", function(event) {
    event.preventDefault();

    // Choose link based on latestFare
    let paymentUrl = "";

    if (latestFare === 124) paymentUrl = "https://buy.stripe.com/test_XXX_BUS124";
    else if (latestFare === 188) paymentUrl = "https://buy.stripe.com/test_XXX_BUS188";
    else if (latestFare === 250) paymentUrl = "https://buy.stripe.com/test_XXX_BUS250";
    else if (latestFare === 310) paymentUrl = "https://buy.stripe.com/test_XXX_BUS310";
    else if (latestFare === 370) paymentUrl = "https://buy.stripe.com/test_XXX_BUS370";
    else if (latestFare === 450) paymentUrl = "https://buy.stripe.com/test_XXX_BUS450";

    else if (latestFare === 184) paymentUrl = "https://buy.stripe.com/test_XXX_SUV184";
    else if (latestFare === 250) paymentUrl = "https://buy.stripe.com/test_XXX_SUV250";
    else if (latestFare === 320) paymentUrl = "https://buy.stripe.com/test_XXX_SUV320";
    else if (latestFare === 390) paymentUrl = "https://buy.stripe.com/test_XXX_SUV390";
    else if (latestFare === 460) paymentUrl = "https://buy.stripe.com/test_XXX_SUV460";
    else if (latestFare === 540) paymentUrl = "https://buy.stripe.com/test_XXX_SUV540";

    else if (latestFare === 220) paymentUrl = "https://buy.stripe.com/test_XXX_FIRST220";
    else if (latestFare === 300) paymentUrl = "https://buy.stripe.com/test_XXX_FIRST300";
    else if (latestFare === 380) paymentUrl = "https://buy.stripe.com/test_XXX_FIRST380";
    else if (latestFare === 450) paymentUrl = "https://buy.stripe.com/test_XXX_FIRST450";
    else if (latestFare === 520) paymentUrl = "https://buy.stripe.com/test_XXX_FIRST520";
    else if (latestFare === 600) paymentUrl = "https://buy.stripe.com/test_XXX_FIRST600";

    else {
      alert("Please contact us directly for a custom quote.");
      return;
    }

    // Redirect to Stripe payment
    window.location.href = paymentUrl;
  });
</script>
  
</body>
</html>

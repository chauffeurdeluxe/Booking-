
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chauffeur de Luxe Booking</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #000;
      color: #FFD700;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      font-size: 28px;
    }
    .tagline {
      text-align: center;
      font-size: 16px;
      margin-bottom: 30px;
    }
    form {
      max-width: 600px;
      margin: auto;
      background-color: #111;
      padding: 20px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    button {
      background-color: #FFD700;
      color: black;
      padding: 12px;
      border: none;
      border-radius: 5px;
      width: 100%;
      font-weight: bold;
      font-size: 16px;
    }
    .thank-you {
      display: none;
      text-align: center;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Chauffeur de Luxe</h1>
  <div class="tagline">Driven by Distinction. Defined by Elegance.</div>

  <form action="https://formspree.io/f/mnnvlnvg" method="POST" onsubmit="handleSubmit(event)">
    <label>Full Name:</label>
    <input type="text" name="name" required />

    <label>Email:</label>
    <input type="email" name="email" required />

    <label>Phone Number:</label>
    <input type="tel" name="phone" required />

    <label>Pickup Location:</label>
    <input type="text" name="pickup" required />

    <label>Drop-off Location:</label>
    <input type="text" name="dropoff" required />

    <label>Pickup Date:</label>
    <input type="date" name="date" required />

    <label>Pickup Time:</label>
    <input type="time" name="time" required />

    <label>Additional Notes:</label>
    <textarea name="notes" rows="4" placeholder="e.g. Flight number, special requests, etc."></textarea>

    <button type="submit">Submit Booking</button>
  </form>

  <div class="thank-you" id="thankYouMessage">
    Thank you! Your booking request has been received. We'll be in touch shortly with a quote and payment link.
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      fetch(form.action, {
        method: form.method,
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          form.style.display = 'none';
          document.getElementById('thankYouMessage').style.display = 'block';
        } else {
          alert("There was an issue submitting the form. Please try again.");
        }
      });
    }
  </script>
</body>
</html>
